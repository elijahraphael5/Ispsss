# Reverse proxy for the ISP platform (mounted as an nginx template).
# Routes by Host header to the three entry points; /api/v1 and /socket.io are
# always forwarded to the api gateway (which proxies microservices + chat WS).
# ${NGINX_*_HOST} are substituted by the nginx image entrypoint from compose env.
upstream api_gateway { server api:4000; }
upstream admin_app { server admin:3000; }
upstream customer_app { server customer:3000; }

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name ${NGINX_ADMIN_HOST};

  client_max_body_size 15m;

  location /api/v1/ {
    proxy_pass http://api_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }
  location /socket.io/ {
    proxy_pass http://api_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }
  location / {
    proxy_pass http://admin_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 80;
  server_name ${NGINX_CUSTOMER_HOST};

  client_max_body_size 15m;

  location /api/v1/ {
    proxy_pass http://api_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }
  location /socket.io/ {
    proxy_pass http://api_gateway;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 86400;
  }
  location / {
    proxy_pass http://customer_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}

server {
  listen 80;
  server_name ${NGINX_API_HOST};

  client_max_body_size 15m;

  location / {
    proxy_pass http://api_gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Request-Id $request_id;
  }
}