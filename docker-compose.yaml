# Coolify production compose for the ISP platform.
# Paste this into a Coolify "Docker Compose" resource, then set the ${VAR} env
# values (see .env.production in the repo). Traefik routes the three domains
# to the nginx service, which splits /api/v1 + /socket.io to the gateway and
# the rest to the admin/customer apps (same-origin API, baked NEXT_PUBLIC_API_URL=/api/v1).
# The init service applies prisma migrations + boots the tenant/admin/plans seed.
# Only FreeRADIUS UDP ports are published (NAS auth). DBs stay internal.
name: isp-platform

x-build: &build
  context: .
  dockerfile: Dockerfile
  args:
    NEXT_PUBLIC_API_URL: /api/v1
    NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: ${NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY}
    NEXT_PUBLIC_SESSION_IDLE_MINUTES: ${NEXT_PUBLIC_SESSION_IDLE_MINUTES:-60}

x-app: &app
  restart: always
  depends_on:
    postgres:
      condition: service_healthy

x-common-env: &common-env
  NODE_ENV: production
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
  # Customer portal base URL used in email links/buttons (falls back to CUSTOMER_URL).
  APP_URL: ${APP_URL}
  # All backends sit behind the nginx reverse proxy, which sets X-Forwarded-For.
  TRUST_PROXY: "true"
  DATABASE_URL: postgresql://isp_user:${POSTGRES_PASSWORD}@postgres:5432/isp_platform
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  WEBHOOK_SERVICE_TOKEN: ${WEBHOOK_SERVICE_TOKEN}
  # Encrypts Paystack/Brevo credentials saved from Settings (required in prod).
  CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
  SESSION_IDLE_TIMEOUT_MS: ${SESSION_IDLE_TIMEOUT_MS:-3600000}
  # Rate limiting (read by api/auth/radius; ignored by the other services).
  AUTH_LOGIN_RATE_LIMIT_PER_MIN: ${AUTH_LOGIN_RATE_LIMIT_PER_MIN:-10}
  AUTH_ACCOUNT_RATE_LIMIT_PER_HOUR: ${AUTH_ACCOUNT_RATE_LIMIT_PER_HOUR:-30}
  AUTH_GLOBAL_RATE_LIMIT_PER_MIN: ${AUTH_GLOBAL_RATE_LIMIT_PER_MIN:-600}
  RATE_LIMIT_MUTATION_PER_MIN: ${RATE_LIMIT_MUTATION_PER_MIN:-120}
  RATE_LIMIT_READ_PER_MIN: ${RATE_LIMIT_READ_PER_MIN:-600}
  RATE_LIMIT_GLOBAL_PER_MIN: ${RATE_LIMIT_GLOBAL_PER_MIN:-1200}

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    mem_limit: 512m
    cpus: 0.5
    environment:
      POSTGRES_USER: isp_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: isp_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isp_user -d isp_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    mem_limit: 128m
    cpus: 0.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  init:
    build:
      <<: *build
      target: runtime-init
    command: sh -c "cd apps/api && npx prisma migrate resolve --rolled-back \"20260916300000_batch7_perf\" || true && npx prisma migrate deploy && npx tsx prisma/seed-prod.ts"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://isp_user:${POSTGRES_PASSWORD}@postgres:5432/isp_platform
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    restart: "no"

  api:
    build:
      <<: *build
      target: runtime-api
    mem_limit: 512m
    cpus: 1.0
    command: ["node", "apps/api/dist/main.js"]
    environment:
      <<: *common-env
      APP_PORT: "4000"
      CUSTOMER_URL: ${CUSTOMER_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
      AUTH_SERVICE_URL: http://auth-service:4101
      PAYMENTS_SERVICE_URL: http://payments-service:4102
      BILLING_SERVICE_URL: http://billing-service:4103
      SUPPORT_SERVICE_URL: http://support-service:4104
      CUSTOMER_SERVICE_URL: http://customer-service:4105
      RADIUS_SERVICE_URL: http://radius-service:4106
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  auth-service:
    build:
      <<: *build
      target: runtime-auth
    command: ["node", "apps/auth-service/dist/main.js"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      <<: *common-env
      APP_PORT: "4101"
      FRONTEND_URL: ${FRONTEND_URL}
      TWO_FA_ISSUER: Hikonnect
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  payments-service:
    build:
      <<: *build
      target: runtime-payments
    command: ["node", "apps/payments-service/dist/main.js"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      <<: *common-env
      APP_PORT: "4102"
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      CUSTOMER_URL: ${CUSTOMER_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  billing-service:
    build:
      <<: *build
      target: runtime-billing
    command: ["node", "apps/billing-service/dist/main.js"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      <<: *common-env
      APP_PORT: "4103"
      CUSTOMER_URL: ${CUSTOMER_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  support-service:
    build:
      <<: *build
      target: runtime-support
    command: ["node", "apps/support-service/dist/main.js"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      <<: *common-env
      APP_PORT: "4104"
      UPLOAD_DIR: /repo/uploads
    volumes:
      - uploads:/repo/uploads
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  customer-service:
    build:
      <<: *build
      target: runtime-customer-svc
    command: ["node", "apps/customer-service/dist/main.js"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      <<: *common-env
      APP_PORT: "4105"
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      SUPPORT_SERVICE_URL: http://support-service:4104
      CUSTOMER_URL: ${CUSTOMER_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      MAIL_FROM: ${MAIL_FROM}
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  mariadb:
    image: mariadb:11
    restart: always
    mem_limit: 512m
    cpus: 0.5
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: radius
      MARIADB_USER: radius
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - ./radius/initdb:/docker-entrypoint-initdb.d:ro
      - radiusdb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 12

  freeradius:
    build:
      context: ./radius
      dockerfile: Dockerfile
    restart: always
    mem_limit: 128m
    cpus: 0.3
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    environment:
      RADIUS_DB_HOST: mariadb
      RADIUS_DB_PORT: "3306"
      RADIUS_DB_USER: radius
      RADIUS_DB_PASSWORD: ${MARIADB_PASSWORD}
      RADIUS_DB_NAME: radius
      RADIUS_NAS_IP: ${RADIUS_NAS_IP}
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET}
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "sh", "-c", "command -v freeradius >/dev/null 2>&1 && freeradius -C || radiusd -C"]
      interval: 10s
      timeout: 5s
      retries: 10

  radius-service:
    build:
      <<: *build
      target: runtime-radius
    mem_limit: 256m
    cpus: 0.5
    command: ["node", "apps/radius-service/dist/main.js"]
    environment:
      <<: *common-env
      APP_PORT: "4106"
      RADIUS_DB_HOST: mariadb
      RADIUS_DB_PORT: "3306"
      RADIUS_DB_USER: radius
      RADIUS_DB_PASSWORD: ${MARIADB_PASSWORD}
      RADIUS_DB_NAME: radius
      RADIUS_NAS_IP: ${RADIUS_NAS_IP}
      RADIUS_NAS_PORT: "3799"
      RADIUS_SHARED_SECRET: ${RADIUS_SHARED_SECRET}
      RADIUS_DEFAULT_PASSWORD: ${RADIUS_DEFAULT_PASSWORD}
      # NOC connectivity test: UDP probes the NAS, Access-Request goes to FreeRADIUS.
      RADIUS_SERVER_HOST: freeradius
      RADIUS_SERVER_PORT: "1812"
      RADIUS_PROBE_USER: ${RADIUS_PROBE_USER:-radius-probe}
      RADIUS_PROBE_PASSWORD: ${RADIUS_PROBE_PASSWORD:-Probe#12345}
    depends_on:
      postgres:
        condition: service_healthy
      mariadb:
        condition: service_healthy
      freeradius:
        condition: service_started
      init:
        condition: service_completed_successfully

  admin:
    build:
      <<: *build
      target: runtime-admin
    environment:
      API_PROXY_TARGET: http://api:4000
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      init:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  customer:
    build:
      <<: *build
      target: runtime-customer
    environment:
      API_PROXY_TARGET: http://api:4000
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    depends_on:
      init:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: ./infra/nginx
    restart: always
    mem_limit: 128m
    cpus: 0.3
    networks:
      - default
      - coolify
    environment:
      NGINX_ADMIN_HOST: ${NGINX_ADMIN_HOST}
      NGINX_CUSTOMER_HOST: ${NGINX_CUSTOMER_HOST}
      NGINX_API_HOST: ${NGINX_API_HOST}
    labels:
      - traefik.enable=true
      - traefik.http.routers.isp-web.priority=1000
      - traefik.http.routers.isp-web.rule=Host(`admin.hikonnectng.com`) || Host(`my.hikonnectng.com`) || Host(`api.hikonnectng.com`)
      - traefik.http.routers.isp-web.entrypoints=https
      - traefik.http.routers.isp-web.tls.certresolver=letsencrypt
      - traefik.http.services.isp-web.loadbalancer.server.port=80
      - traefik.http.routers.isp-web-http.priority=1000
      - traefik.http.routers.isp-web-http.rule=Host(`admin.hikonnectng.com`) || Host(`my.hikonnectng.com`) || Host(`api.hikonnectng.com`)
      - traefik.http.routers.isp-web-http.entrypoints=http
      - traefik.http.routers.isp-web-http.middlewares=isp-web-redirect
      - traefik.http.middlewares.isp-web-redirect.redirectscheme.scheme=https
      - traefik.http.middlewares.isp-web-redirect.redirectscheme.permanent=true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - api
      - admin
      - customer

networks:
  coolify:
    external: true

volumes:
  pgdata:
  radiusdb:
  uploads:
