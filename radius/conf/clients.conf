#
# RADIUS clients.
#
# NAS (router) entries are read from the MariaDB `nas` table — the FreeRADIUS
# sql module is configured with `read_clients = yes` and the admin NOC page
# manages rows in that table. Do NOT add a static NAS block here or the SQL
# client will be a duplicate definition.
#
# The blocks below cover:
#   - localhost: radtest / radclient from inside the container
#   - docker:    containers on the private compose network (RADIUS auth probe)
#
# @@RADIUS_SHARED_SECRET@@ is templated at container boot (entrypoint.sh).
#

client localhost {
	ipaddr = 127.0.0.1
	secret = @@RADIUS_SHARED_SECRET@@
	shortname = localhost
	nas_type = other
}

client docker {
	ipaddr = 172.16.0.0/12
	secret = @@RADIUS_SHARED_SECRET@@
	shortname = docker
	nas_type = other
}
