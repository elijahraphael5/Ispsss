#
# Radius clients — assembled from the stock file, trimmed for local dev.
# The `mikrotik` block is templated at container boot from RADIUS_NAS_IP /
# RADIUS_SHARED_SECRET (see entrypoint.sh).
#

client localhost {
	ipaddr = 127.0.0.1
	secret = testing123
	shortname = localhost
	nas_type = other
}

client mikrotik {
	ipaddr = @@RADIUS_NAS_IP@@
	secret = @@RADIUS_SHARED_SECRET@@
	shortname = mikrotik
	nas_type = mikrotik
}