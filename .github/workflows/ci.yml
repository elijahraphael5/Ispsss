name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Check Prisma schema drift
        run: node scripts/check-prisma-identical.mjs

      - name: Build backend apps
        run: |
          for app in api auth-service billing-service customer-service payments-service radius-service support-service; do
            pnpm --filter "$app" build
          done

      - name: Run tests
        run: pnpm test
